    <section class="mx-auto max-w-6xl px-4 py-10 sm:px-6 sm:py-14 lg:px-8">
      <p class="font-mono text-xs tracking-[0.2em] text-pulse uppercase">Docs</p>
      <h1 class="mt-3 max-w-3xl text-[clamp(1.8rem,5vw,3rem)] font-semibold tracking-[-0.03em]">
        How to use RepoDoctor during alpha.
      </h1>
      <p class="mt-4 max-w-2xl text-base leading-relaxed text-ink-200 sm:text-lg">
        This is the product guide. Engineering internals live in the separate docs repository.
      </p>
      <div class="mt-10 space-y-4">
        @for (topic of topics; track topic.title) {
          <mat-card appearance="outlined">
            <mat-card-header>
              <mat-card-title>{{ topic.title }}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <p class="text-sm leading-relaxed text-ink-200">{{ topic.body }}</p>
            </mat-card-content>
          </mat-card>
        }
      </div>
      <a mat-stroked-button class="mt-8" routerLink="/login">Sign in to the dashboard</a>
    </section>
