    <div class="grid min-h-screen lg:grid-cols-2">
      <section class="rd-chrome hidden border-r border-white/10 bg-ink p-12 lg:flex lg:flex-col lg:justify-between">
        <div>
          <p class="inline-flex items-center gap-2 text-sm uppercase tracking-[0.2em] text-pulse">
            <span class="h-2 w-2 rounded-full bg-pulse"></span>
            RepoDoctor
          </p>
          <h1 class="mt-6 max-w-md text-4xl font-semibold leading-tight text-white">
            See the architecture, not just the diff.
          </h1>
          <p class="mt-4 max-w-md text-mute">
            Connect repositories, run deterministic analyzers, and keep AI grounded in evidence.
          </p>
        </div>
      </section>
      <section class="flex items-center justify-center bg-canvas px-6 py-12">
        <form class="w-full max-w-sm space-y-2" [formGroup]="form" (ngSubmit)="submit()">
          <h2 class="text-2xl font-semibold">Sign in</h2>
          @if (inviteHint()) {
            <p class="rounded-md border border-line bg-panel px-3 py-2 text-sm text-ink-200">
              {{ inviteHint() }}
            </p>
          }
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" autocomplete="username" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" autocomplete="current-password" />
          </mat-form-field>
          <div class="flex flex-col gap-2">
            <app-loading-button
              hostClass="w-full"
              type="basic"
              [disabled]="form.invalid"
              [loading]="loading()"
              (pressed)="submit()"
              label="Sign in"
              loadingLabel="Signing in…"
            />
            <app-loading-button
              hostClass="w-full"
              type="stroke"
              [disabled]="loading()"
              [loading]="loading()"
              (pressed)="github()"
              label="Continue with GitHub"
              loadingLabel="Signing in…"
            />
          </div>
          <div class="flex justify-between text-sm text-ink-200">
            <a routerLink="/signup" [queryParams]="inviteToken ? { invite: inviteToken } : {}" class="hover:text-moss-300">Create account</a>
            <a routerLink="/forgot-password" class="hover:text-moss-300">Forgot password</a>
          </div>
        </form>
      </section>
    </div>
