    <div class="space-y-6">
      <app-page-header eyebrow="Tenancy" title="Organizations" />
      <mat-card appearance="outlined">
        <mat-card-content>
          <form class="flex flex-wrap items-start gap-3" [formGroup]="form" (ngSubmit)="create()">
            <mat-form-field appearance="outline" subscriptSizing="dynamic" class="min-w-[12rem] flex-1">
              <mat-label>Name</mat-label>
              <input matInput formControlName="name" />
            </mat-form-field>
            <mat-form-field appearance="outline" subscriptSizing="dynamic" class="min-w-[12rem] flex-1">
              <mat-label>Slug (optional)</mat-label>
              <input matInput formControlName="slug" />
            </mat-form-field>
            <button mat-flat-button class="ml-auto" type="submit" [disabled]="form.invalid || saving()">Create</button>
          </form>
        </mat-card-content>
      </mat-card>
      @if (loading()) {
        <mat-card appearance="outlined">
          <mat-card-content>
            <app-loading-state label="Loading…" />
          </mat-card-content>
        </mat-card>
      } @else if (items().length === 0) {
        <mat-card appearance="outlined">
          <mat-card-content class="text-ink-200">No organizations yet. Create one to become OWNER.</mat-card-content>
        </mat-card>
      } @else {
        <app-organization-table
          [organizations]="items()"
          [showActions]="true"
          (rowClick)="open($event)"
          (remove)="askDelete($event)"
        />
      }
    </div>
