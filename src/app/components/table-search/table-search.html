    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full sm:max-w-sm">
      <mat-label>{{ label() }}</mat-label>
      <input
        matInput
        [value]="query()"
        [disabled]="disabled()"
        (input)="query.set($any($event.target).value)"
        autocomplete="off"
      />
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
