    @defer (on viewport; prefetch on idle) {
      <div class="space-y-3">
        <app-table-search [query]="table.query()" (queryChange)="table.onSearch($event)" label="Search organizations" />
        <div class="space-y-3 md:hidden">
          @for (org of table.page(); track org.id) {
            <button
              type="button"
              class="w-full rounded-xl border border-line bg-panel p-4 text-left"
              (click)="rowClick.emit(org)"
            >
              <p class="font-medium">{{ org.name }}</p>
              <p class="mt-1 font-mono text-xs text-ink-200">{{ org.slug }}</p>
              <p class="mt-2 font-mono text-xs text-moss-200">{{ org.role }}</p>
              @if (showActions() && (org.role === 'OWNER' || org.role === 'ADMIN')) {
                <button
                  mat-button
                  color="warn"
                  type="button"
                  class="mt-2 !px-0"
                  (click)="$event.stopPropagation(); remove.emit(org)"
                >
                  Delete
                </button>
              }
            </button>
          } @empty {
            <p class="px-1 text-sm text-ink-200">No matching organizations.</p>
          }
        </div>
        <div class="rd-table-wrap hidden md:block">
          <table mat-table [dataSource]="table.page()" matSort (matSortChange)="table.onSort($event)">
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
              <td mat-cell *matCellDef="let org">{{ org.name }}</td>
            </ng-container>
            <ng-container matColumnDef="slug">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Slug</th>
              <td mat-cell *matCellDef="let org">
                <span class="font-mono text-xs text-ink-200">{{ org.slug }}</span>
              </td>
            </ng-container>
            <ng-container matColumnDef="role">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
              <td mat-cell *matCellDef="let org">
                <span class="font-mono text-xs text-moss-200">{{ org.role }}</span>
              </td>
            </ng-container>
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef class="rd-col-end"></th>
              <td mat-cell *matCellDef="let org" class="rd-col-end">
                @if (org.role === 'OWNER' || org.role === 'ADMIN') {
                  <button
                    mat-icon-button
                    type="button"
                    aria-label="Organization actions"
                    [matMenuTriggerFor]="menu"
                    (click)="$event.stopPropagation()"
                  >
                    <mat-icon>more_vert</mat-icon>
                  </button>
                  <mat-menu #menu="matMenu">
                    <button mat-menu-item type="button" (click)="remove.emit(org)">Delete</button>
                  </mat-menu>
                }
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns()" (click)="rowClick.emit(row)"></tr>
          </table>
        </div>
        <mat-paginator
          [length]="table.total()"
          [pageIndex]="table.pageIndex()"
          [pageSize]="table.pageSize()"
          [pageSizeOptions]="[5, 10, 25]"
          showFirstLastButtons
          (page)="table.onPage($event)"
        />
      </div>
    } @placeholder {
      <p class="p-4 text-sm text-mute">Loading organizations…</p>
    }
