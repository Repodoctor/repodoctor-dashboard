    <div class="min-h-screen grid grid-cols-1 bg-ink text-cloud lg:grid-cols-[240px_1fr]">
      <aside class="hidden min-h-screen flex-col border-r border-line bg-panel lg:flex">
        <div class="flex items-center gap-2 px-5 py-5">
          <span class="h-2.5 w-2.5 rounded-full bg-pulse"></span>
          <a routerLink="/dashboard" class="font-mono text-sm tracking-[0.18em] text-pulse uppercase">RepoDoctor</a>
        </div>
        @for (group of groups; track group.label) {
          <p class="px-5 pb-1 pt-3 font-mono text-[0.65rem] tracking-[0.16em] text-mute uppercase">
            {{ group.label }}
          </p>
          <mat-nav-list class="!px-2">
            @for (item of group.links; track item.path) {
              <a mat-list-item [routerLink]="item.path" routerLinkActive="mdc-list-item--activated">
                <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
                <span matListItemTitle>{{ item.label }}</span>
              </a>
            }
          </mat-nav-list>
        }
        <div class="mt-auto border-t border-line p-3">
          <button mat-button class="w-full !justify-start" type="button" (click)="auth.logout()">
            <mat-icon>logout</mat-icon>
            <span>Sign out</span>
          </button>
        </div>
      </aside>
      <div class="min-w-0">
        <header class="flex items-center justify-between gap-3 border-b border-line px-4 py-3.5 sm:px-6">
          <p class="text-sm text-mute">Software engineering intelligence</p>
          <app-user-menu />
        </header>
        <main class="px-4 py-6 sm:px-6 lg:px-8">
          <router-outlet />
        </main>
      </div>
    </div>
